  <div class="nota">
    <p><a id="notaa"></a><sup>[a]</sup> Isaías 34:9 <em>Brea</em>. Sustancia parecida al betún, que se encontraba en Mesopotamia y en el valle del Jordán. Se untaba en las rendijas de los barcos o de los canastos para que el agua no penetrara. <a href="../Text/Section0023.xhtml#notaa">&lt;&lt;</a></p>
