  <h2>Notas de Efesios</h2>

  <div class="nota">
    <p><a id="notaa"></a><sup>[a]</sup> Efesios 4:5 Fe: La palabra griega que se traduce como fe, puede también traducirse como <em>confianza</em>. En este caso, fe se refiere al hecho de que la iglesia cristiana cree en la muerte y la resurrección de Jesús, y confía en él como su Señor y Salvador. <a href="../Text/Section0049.xhtml#notaa">&lt;&lt;</a></p>
