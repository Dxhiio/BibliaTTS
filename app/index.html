<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Lee y escucha la Biblia completa en español (Traducción al Lenguaje Actual). Navegación por libros, capítulos y versículos con audio sincronizado." />
  <title>Biblia TLA — Leer y Escuchar</title>

  <!-- Fuentes de Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/css/style.css" />

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-C9YJ26ZFRF"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-C9YJ26ZFRF');
  </script>
</head>
<body>

  <!-- ═══════════════════════════════════════════ -->
  <!--  SIDEBAR — Navegación de libros             -->
  <!-- ═══════════════════════════════════════════ -->
  <aside id="sidebar" class="sidebar" aria-label="Navegación de la Biblia">

    <!-- Header del sidebar -->
    <div class="sidebar__header">
      <div class="sidebar__logo">
        <span class="sidebar__logo-icon">✦</span>
        <div>
          <h1 class="sidebar__title">Biblia TLA</h1>
          <p class="sidebar__subtitle">Traducción al Lenguaje Actual</p>
        </div>
      </div>
      <button id="btn-close-sidebar" class="btn-icon" aria-label="Cerrar menú" title="Cerrar menú">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- Selector de Traducción y Botón Agregar -->
    <div class="sidebar__translation-bar" style="padding: 0 16px 12px; display: flex; gap: 8px; align-items: center;">
      <select id="translation-select" class="translation-select" aria-label="Seleccionar Traducción" style="flex: 1; background: var(--bg-surface-2, #1e1e24); color: var(--text-main, #fff); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 8px;">
        <option value="TLA">TLA (Oficial con Audio)</option>
      </select>
    </div>

    <!-- Búsqueda rápida -->
    <div class="sidebar__search">
      <svg class="sidebar__search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input id="search-input" type="text" placeholder="Buscar libro..." autocomplete="off" aria-label="Buscar libro" />
    </div>

    <!-- Tabs AT / NT -->
    <div class="sidebar__tabs" role="tablist">
      <button id="tab-at" class="sidebar__tab sidebar__tab--active" role="tab" aria-selected="true" aria-controls="books-at">
        Antiguo Testamento
      </button>
      <button id="tab-nt" class="sidebar__tab" role="tab" aria-selected="false" aria-controls="books-nt">
        Nuevo Testamento
      </button>
    </div>

    <!-- Lista de libros -->
    <nav class="sidebar__nav">
      <div id="books-at" class="books-panel" role="tabpanel" aria-labelledby="tab-at">
        <div id="books-at-list" class="books-list">
          <div class="loading-books">
            <div class="spinner"></div>
            <span>Cargando libros...</span>
          </div>
        </div>
      </div>
      <div id="books-nt" class="books-panel books-panel--hidden" role="tabpanel" aria-labelledby="tab-nt">
        <div id="books-nt-list" class="books-list"></div>
      </div>
    </nav>

  </aside>

  <!-- ═══════════════════════════════════════════ -->
  <!--  OVERLAY para móvil                         -->
  <!-- ═══════════════════════════════════════════ -->
  <div id="sidebar-overlay" class="sidebar-overlay" aria-hidden="true"></div>

  <!-- ═══════════════════════════════════════════ -->
  <!--  CONTENIDO PRINCIPAL                        -->
  <!-- ═══════════════════════════════════════════ -->
  <main class="main-layout">

    <!-- Topbar -->
    <header class="topbar" id="topbar">
      <button id="btn-open-sidebar" class="btn-icon topbar__menu-btn" aria-label="Abrir menú de libros">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>

      <!-- Center: Dynamic Header -->
      <div class="topbar__center" id="topbar-center">
        <h2 id="topbar-book" class="topbar__book">Biblia TLA</h2>
        <div id="topbar-chapter" class="topbar__chapter"></div>
        <div id="topbar-section" class="topbar__section"></div>
      </div>

      <!-- Selector de capítulo rápido -->
      <div class="topbar__chapter-nav" id="chapter-nav" aria-label="Navegación de capítulos">
        <button id="btn-prev-chapter" class="btn-icon" aria-label="Capítulo anterior" title="Capítulo anterior" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
        </button>
        <button id="btn-chapter-picker" class="topbar__chapter-picker" aria-label="Seleccionar capítulo" title="Ir a capítulo">
          <span id="chapter-picker-label">—</span>
        </button>
        <button id="btn-next-chapter" class="btn-icon" aria-label="Capítulo siguiente" title="Capítulo siguiente" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Modal selector de capítulo -->
    <div id="chapter-picker-modal" class="modal" role="dialog" aria-modal="true" aria-label="Seleccionar capítulo" hidden>
      <div class="modal__backdrop" id="chapter-modal-backdrop"></div>
      <div class="modal__box">
        <h2 class="modal__title" id="chapter-modal-book-name">Seleccionar capítulo</h2>
        <div id="chapter-picker-grid" class="chapter-grid"></div>
      </div>
    </div>

    <!-- Modal Configuración de Reproducción -->
    <div id="playback-config-modal" class="modal" role="dialog" aria-modal="true" aria-label="Configuración de Lectura Continua" hidden>
      <div class="modal__backdrop" id="playback-modal-backdrop"></div>
      <div class="modal__box modal__box--playback">
        <h2 class="modal__title">Lectura Continua</h2>
        
        <div class="playback-config">
          <label class="toggle-switch">
            <input type="checkbox" id="toggle-autoplay">
            <span class="toggle-slider"></span>
            <span class="toggle-label">Avanzar al siguiente capítulo automáticamente</span>
          </label>
          
          <div id="playback-range-section" class="playback-range" style="opacity: 0.5; pointer-events: none;">
            <p class="playback-range__hint">Define un límite para detener la reproducción automáticamente.</p>
            
            <div class="range-group">
              <label>Detener al finalizar:</label>
              <div class="range-controls">
                <select id="select-end-book" class="range-select"></select>
                <select id="select-end-chapter" class="range-select"></select>
              </div>
            </div>
          </div>
          
          <button id="btn-save-playback" class="btn-primary">Guardar Configuración</button>
        </div>
      </div>
    </div>

    <!-- Área de lectura -->
    <section class="reading-area" id="reading-area" aria-live="polite" aria-atomic="false">

      <!-- Contenedor para mensajes de error (antes welcome screen) -->
      <div class="welcome-screen" id="welcome-screen" hidden></div>

      <!-- Contenido del capítulo -->
      <article id="chapter-content" class="chapter-content" hidden>
        <!-- El header dinámico ahora vive en la topbar, así que este contenedor arranca directo en los versos -->
        <div id="chapter-verses" class="chapter-verses"></div>

        <!-- Navegación inferior (capítulo anterior/siguiente) -->
        <div class="chapter-footer-nav">
          <button id="btn-prev-bottom" class="btn-chapter-nav" aria-label="Capítulo anterior">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="15 18 9 12 15 6"/>
            </svg>
            <span id="prev-label">Anterior</span>
          </button>
          <button id="btn-next-bottom" class="btn-chapter-nav btn-chapter-nav--next" aria-label="Capítulo siguiente">
            <span id="next-label">Siguiente</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="9 18 15 12 9 6"/>
            </svg>
          </button>
        </div>
      </article>

      <!-- Estado de carga -->
      <div id="loading-screen" class="loading-screen" hidden>
        <div class="spinner spinner--large"></div>
        <p>Cargando...</p>
      </div>

    </section>

  </main>

  <!-- ═══════════════════════════════════════════ -->
  <!--  REPRODUCTOR DE AUDIO — barra inferior fija  -->
  <!-- ═══════════════════════════════════════════ -->
  <footer id="audio-player" class="audio-player" aria-label="Reproductor de audio" hidden>

    <!-- Info del capítulo en reproducción -->
    <div class="player__info">
      <div class="player__book-icon">🎙</div>
      <div class="player__text">
        <span class="player__book" id="player-book-name">—</span>
        <span class="player__chapter" id="player-chapter-name">—</span>
      </div>
    </div>

    <!-- Controles centrales -->
    <div class="player__controls">
      <!-- Barra de progreso -->
      <div class="player__progress-wrap">
        <span class="player__time" id="player-current-time">0:00</span>
        <div class="player__progress-bar" id="progress-bar" role="slider"
             aria-label="Progreso del audio" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"
             tabindex="0">
          <div class="player__progress-fill" id="progress-fill"></div>
          <div class="player__progress-thumb" id="progress-thumb"></div>
        </div>
        <span class="player__time" id="player-total-time">0:00</span>
      </div>

      <!-- Botones de control -->
      <div class="player__buttons">
        <button id="btn-autoplay-config" class="btn-player btn-player--autoplay" aria-label="Configurar Lectura Continua" title="Autoplay / Rango">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
          </svg>
        </button>

        <button id="btn-speed" class="btn-player btn-player--speed" aria-label="Velocidad de reproducción" title="Cambiar velocidad">
          <span id="speed-label">1×</span>
        </button>

        <button id="btn-hq" class="btn-player btn-player--hq" aria-label="Calidad de audio" title="Activar/Desactivar Alta Calidad (92kbps)">
          <span id="hq-label">HQ</span>
        </button>

        <button id="btn-rewind" class="btn-player" aria-label="Retroceder 10 segundos" title="−10s">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="1 4 1 10 7 10"/>
            <path d="M3.51 15a9 9 0 1 0 .49-3.89"/>
            <text x="7" y="16" font-size="6" fill="currentColor" stroke="none">10</text>
          </svg>
        </button>

        <button id="btn-play" class="btn-player btn-player--play" aria-label="Reproducir" title="Reproducir / Pausar">
          <!-- Play icon -->
          <svg id="icon-play" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
          <!-- Pause icon (hidden initially) -->
          <svg id="icon-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none">
            <rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>
          </svg>
        </button>

        <button id="btn-forward" class="btn-player" aria-label="Adelantar 10 segundos" title="+10s">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="23 4 23 10 17 10"/>
            <path d="M20.49 15a9 9 0 1 1-.49-3.89"/>
            <text x="7" y="16" font-size="6" fill="currentColor" stroke="none">10</text>
          </svg>
        </button>

        <!-- Volumen -->
        <div class="player__volume-wrap">
          <button id="btn-mute" class="btn-player" aria-label="Silenciar" title="Silenciar">
            <svg id="icon-vol-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
            </svg>
            <svg id="icon-vol-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
              <line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>
            </svg>
          </button>
          <input id="volume-slider" type="range" min="0" max="1" step="0.05" value="1"
                 class="volume-slider" aria-label="Volumen" />
        </div>
      </div>
    </div>

    <!-- Audio element (invisible) -->
    <audio id="audio-element" preload="metadata"></audio>

  </footer>



  <!-- ═══════════════════════════════════════════ -->
  <!--  SCRIPTS                                    -->
  <!-- ═══════════════════════════════════════════ -->
  <script src="/js/storage.js"></script>
  <script src="/js/navigation.js"></script>
  <script src="/js/player.js"></script>
  <script src="/js/app.js"></script>

</body>
</html>
